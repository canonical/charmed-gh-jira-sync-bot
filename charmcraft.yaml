# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/ for guidance.
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: charmed-github-jira-bot

type: charm

base: ubuntu@24.04

platforms:
  amd64:

summary: Charmed https://github.com/canonical/gh-jira-sync-bot
description: |
  A 12-factor charm for the GitHub Jira sync bot: a FastAPI service that backs a
  GitHub App and synchronizes GitHub issues and comments to Jira.

extensions:
  - fastapi-framework

requires:
  redis:
    interface: redis
    optional: false
    limit: 1

config:
  options:
    jira-instance:
      type: string
      description: URL of the Jira instance to sync issues to. Sets APP_JIRA_INSTANCE.
      optional: false
    jira-username:
      type: string
      description: Jira username used to authenticate. Sets APP_JIRA_USERNAME.
      optional: false
    github-app-id:
      type: string
      description: GitHub App ID. Sets APP_GITHUB_APP_ID.
      optional: false
    bot-name:
      type: string
      description: Login of the bot account; webhooks from it are ignored. Sets APP_BOT_NAME.
      default: ""
    max-concurrent-webhooks:
      type: int
      description: Maximum number of webhooks processed concurrently. Sets APP_MAX_CONCURRENT_WEBHOOKS.
      default: 20
    default-bot-config:
      type: string
      description: YAML/JSON default bot settings. Sets APP_DEFAULT_BOT_CONFIG.
      default: ""
    github:
      type: secret
      description: |
        Juju user secret ID for the GitHub App private key. The secret must contain a
        single key, "private-key". Injected as APP_GITHUB_PRIVATE_KEY. Create it with
        `juju add-secret gh-private-key private-key=<pem> && juju grant-secret gh-private-key <app>`
        and configure this option with the resulting secret ID.
    webhook:
      type: secret
      description: |
        Juju user secret ID for the GitHub App webhook secret. The secret must contain a
        single key, "secret". Injected as APP_WEBHOOK_SECRET.
    jira:
      type: secret
      description: |
        Juju user secret ID for the Jira API token. The secret must contain a single
        key, "token". Injected as APP_JIRA_TOKEN.
